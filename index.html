<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sock Calculator</title>
		<link rel="stylesheet" href="assets/css/styles.css" />
	</head>

	<body class="page">
		<header class="page__header">
			<div class="page__container">
				<h1 class="page__title">Sock Calculator</h1>
				<p class="page__subtitle">
					Use standard EU sizes 34–46, pick a heel type and direction, and get stitch/row counts.
				</p>
			</div>
		</header>

		<main class="page__main">
			<div class="page__container">
				<form class="calculator" id="calculator" novalidate>
					<section class="calculator__section" aria-labelledby="inputs-heading">
						<h2 class="calculator__heading" id="inputs-heading">Inputs</h2>

						<div class="calculator__grid">
							<div class="field">
								<label class="field__label" id="euSize-label" for="euSize">EU size</label>
								<select
									class="field__control field__control--native"
									id="euSize"
									name="euSize"
									required
								>
								</select>
								<div class="select" data-select>
									<button
										class="select__trigger"
										type="button"
										aria-haspopup="listbox"
										aria-expanded="false"
										aria-labelledby="euSize-label euSize-value"
									>
										<span class="select__value" id="euSize-value"></span>
										<span class="select__icon" aria-hidden="true">▾</span>
									</button>
									<ul
										class="select__list"
										role="listbox"
										tabindex="-1"
										aria-labelledby="euSize-label"
									></ul>
								</div>
							</div>

							<div class="field">
								<label class="field__label" id="heelType-label" for="heelType">Heel type</label>
								<select
									class="field__control field__control--native"
									id="heelType"
									name="heelType"
									required
								>
								</select>
								<div class="select" data-select>
									<button
										class="select__trigger"
										type="button"
										aria-haspopup="listbox"
										aria-expanded="false"
										aria-labelledby="heelType-label heelType-value"
									>
										<span class="select__value" id="heelType-value"></span>
										<span class="select__icon" aria-hidden="true">▾</span>
									</button>
									<ul
										class="select__list"
										role="listbox"
										tabindex="-1"
										aria-labelledby="heelType-label"
									></ul>
								</div>
							</div>

							<div class="field">
								<label class="field__label" id="direction-label" for="direction">Knitting direction</label>
								<select
									class="field__control field__control--native"
									id="direction"
									name="direction"
									required
								>
								</select>
								<div class="select" data-select>
									<button
										class="select__trigger"
										type="button"
										aria-haspopup="listbox"
										aria-expanded="false"
										aria-labelledby="direction-label direction-value"
									>
										<span class="select__value" id="direction-value"></span>
										<span class="select__icon" aria-hidden="true">▾</span>
									</button>
									<ul
										class="select__list"
										role="listbox"
										tabindex="-1"
										aria-labelledby="direction-label"
									></ul>
								</div>
							</div>

							<div class="field">
								<label class="field__label" for="gaugeSts">Gauge (stitches per cm)</label>
								<input
									class="field__control"
									type="number"
									id="gaugeSts"
									name="gaugeSts"
									min="1"
									step="0.1"
									value="3.0"
									required
								/>
							</div>

							<div class="field">
								<label class="field__label" for="gaugeRows">Gauge (rows per cm)</label>
								<input
									class="field__control"
									type="number"
									id="gaugeRows"
									name="gaugeRows"
									min="1"
									step="0.1"
									value="4.0"
									required
								/>
							</div>

							<div class="field">
								<label class="field__label" for="negativeEase">Negative ease (%)</label>
								<input
									class="field__control"
									type="number"
									id="negativeEase"
									name="negativeEase"
									min="0"
									max="25"
									step="1"
									value="10"
									required
								/>
							</div>

							<div class="field">
								<label class="field__label" for="ankleCirc">Ankle circumference (cm, optional)</label>
								<input
									class="field__control"
									type="number"
									id="ankleCirc"
									name="ankleCirc"
									min="15"
									step="0.1"
									placeholder="e.g. 22.0"
								/>
							</div>

							<div class="field">
								<label class="field__label" for="legLength">Leg length (cm, optional)</label>
								<input
									class="field__control"
									type="number"
									id="legLength"
									name="legLength"
									min="5"
									step="0.5"
									placeholder="default 15"
								/>
							</div>
						</div>

						<div class="calculator__actions">
							<button class="button" type="submit">Calculate</button>
							<button class="button button--secondary" type="button" id="resetButton">Reset</button>
						</div>
					</section>

					<section class="calculator__section calculator__section--results" aria-labelledby="results-heading">
						<h2 class="calculator__heading" id="results-heading">Results</h2>
						<div class="results" id="results" aria-live="polite"></div>
					</section>
				</form>
			</div>
		</main>

		<script src="assets/js/heels/square.js"></script>

	</body>
